<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Welcome to your Library</h1>
    <form action="#" method="get" class="newBook">
        <p>Add a new book</p>
        <input type="text" placeholder="Title" class="bookTitle">
        <input type="text" placeholder="Author" class="bookAuthor">
        <input type="text" placeholder="Pages" class="bookPages">
        <button class="addNewBook">Add Book</button>
    </form>
    <div class="libraryDisplay"></div>
</body>
</html>
